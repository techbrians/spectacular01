<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Creative Studio - Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <header>
        <h1>Tech Creative Studio</h1>
        <p>Admin Dashboard</p>
    </header>

    <main>
        <h2>Website Overview</h2>

        <div class="dashboard">

            <div class="card">
                <h3>Total Visitors</h3>
                <p id="visitors">0</p>
            </div>

            <div class="card">
                <h3>Page Views</h3>
                <p id="pageViews">0</p>
            </div>

            <div class="card">
                <h3>Facebook Clicks</h3>
                <p id="facebookClicks">0</p>
            </div>

            <div class="card">
                <h3>WhatsApp Clicks</h3>
                <p id="whatsappClicks">0</p>
            </div>

        </div>
    </main>

</body>
</html>
